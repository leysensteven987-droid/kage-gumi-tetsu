  <g opacity="0.16" fill="none" stroke="#d7dae0" stroke-width="30" stroke-linecap="round">
    <path d="M377 143 A52 52 0 1 0 303 217"/>
    <path d="M303 217 L176 344"/>
  </g>
  <text x="256" y="352" text-anchor="middle" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="300" font-weight="700" fill="#d7dae0">鉄</text>
</svg>
