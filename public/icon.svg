<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Tetsu">
  <!-- Kage-gumi app mark: dark-steel rounded square, 鉄 centered in brushed chrome,
       with an open-end wrench as a faint watermark behind it. Family-matched to
       Raiden + the KG mobile hanko: dark ground, one big serif kanji in the
       operative accent. Maskable-safe: ground inset 16px, marks inside the safe zone. -->
